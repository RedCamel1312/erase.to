name: Feature request
description: Propose a concrete improvement to private, temporary sharing.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Keep examples synthetic. Do not post private links, message content, capabilities, credentials, IP addresses or logs. Report undisclosed vulnerabilities through [SECURITY.md](https://github.com/RedCamel1312/erase.to/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What concrete task is difficult today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible result. Consider the project's temporary storage, no-account and no-tracking model.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and privacy implications
      description: Mention simpler alternatives and any new storage, metadata, dependencies or trust this would require.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report
      options:
        - label: This request contains only synthetic examples and no private links, messages, capabilities, secrets, IP addresses or logs.
          required: true
