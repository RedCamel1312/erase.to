[package]
name = "erase-server"
version = "3.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
bytes = "1"
hex = "0.4"
http-body = "1"
redis = { version = "1", default-features = false, features = ["aio", "tokio-comp"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tower-http = { version = "0.7", features = ["fs"] }
url = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
