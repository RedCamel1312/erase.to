# Plain HTTP relay for Docker host-port publishing. Terminate public TLS outside it.
# Only this relay has a default-gateway network; application and cache stay internal.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;

events { worker_connections 128; }

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /etc/nginx/erase-admission.conf;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 65m;
        client_body_buffer_size 64k;
        client_header_timeout 10s;
        client_body_timeout 30s;
        send_timeout 30s;
        keepalive_timeout 15s;
        keepalive_requests 100;
        reset_timedout_connection on;
        limit_conn erase_lane_conn 8;
        limit_conn_status 503;
        limit_req zone=erase_lane_req burst=120 nodelay;
        limit_req zone=erase_challenge_req burst=20 nodelay;
        limit_req_status 429;
        add_header Retry-After $erase_retry_after always;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            # Resolve again after an app-container replacement. This is a fixed
            # destination, never a client-supplied proxy target.
            set $erase_upstream http://app:3001;
            proxy_pass $erase_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header Referer "";
            proxy_hide_header Cache-Control;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Content-Type-Options;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_max_temp_file_size 0;
            proxy_connect_timeout 3s;
            proxy_read_timeout 330s;
            proxy_send_timeout 30s;
            proxy_next_upstream off;
        }
    }
}
