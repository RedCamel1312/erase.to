port 0
unixsocket /run/erase-cache/valkey.sock
unixsocketperm 660
protected-mode yes
daemonize no
supervised no
save ""
appendonly no
dir /run/erase-cache
dbfilename unused.rdb
maxmemory 512mb
maxmemory-policy noeviction
maxclients 64
timeout 30
tcp-keepalive 30
loglevel warning
logfile /dev/null
slowlog-log-slower-than -1
slowlog-max-len 0
latency-monitor-threshold 0
latency-tracking no
acllog-max-len 0
notify-keyspace-events ""
client-output-buffer-limit normal 256mb 128mb 15
client-query-buffer-limit 192mb
proto-max-bulk-len 128mb
rename-command MONITOR ""
rename-command DEBUG ""
rename-command REPLICAOF ""
rename-command SLAVEOF ""
rename-command MIGRATE ""
rename-command SAVE ""
rename-command BGSAVE ""
rename-command BGREWRITEAOF ""
