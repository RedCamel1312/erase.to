# Render the site's base32 destination in __I2P_HOST__. Only i2pd needs this listener.
server {
    listen 127.0.0.1:7382;
    server_name __I2P_HOST__;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 65m;
    client_body_buffer_size 64k;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 15s;
    reset_timedout_connection on;
    limit_conn erase_lane_conn 4;
    limit_conn_status 503;
    limit_req zone=erase_lane_req burst=60 nodelay;
    limit_req zone=erase_challenge_req burst=20 nodelay;
    limit_req_status 429;
    add_header Retry-After $erase_retry_after always;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    if ($http_host != "__I2P_HOST__") { return 444; }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        # Forward only protocol fields. nginx supplies body framing for both
        # fixed-length and chunked uploads. I2P peer metadata stays at the tunnel.
        proxy_pass_request_headers off;
        proxy_set_header Host $server_name;
        proxy_set_header Connection "";
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Encoding $http_content_encoding;
        proxy_set_header Origin $http_origin;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header X-Erase-Challenge $http_x_erase_challenge;
        proxy_set_header X-Erase-Nonce $http_x_erase_nonce;
        proxy_hide_header Cache-Control;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 3s;
        proxy_read_timeout 330s;
        proxy_send_timeout 30s;
        proxy_next_upstream off;
    }
}
