# Drop-in for the Debian/Ubuntu i2pd.service. Keep the packaged i2pd user and group.
[Service]
Type=simple
ExecStart=
ExecStart=/usr/bin/i2pd --datadir=/var/lib/i2pd --conf=/etc/i2pd/i2pd.conf --tunconf=/etc/i2pd/tunnels.conf --tunnelsdir=/etc/i2pd/tunnels.conf.d
PIDFile=
Restart=on-failure
RestartSec=5
UMask=0077
LimitCORE=0
MemorySwapMax=0
MemoryMax=384M
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectHome=yes
ProtectSystem=strict
ReadWritePaths=
ReadWritePaths=/var/lib/i2pd /run/i2pd
StandardOutput=null
StandardError=null
