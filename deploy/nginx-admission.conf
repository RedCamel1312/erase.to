# HTTP context. Only the configured service name and one of four constant
# operation names enter shared memory. Never use a client address or note ID.
map "$request_method:$uri" $erase_lane {
    default public;
    GET:/api/challenge challenge;
    HEAD:/api/challenge challenge;
    POST:/api/notes upload;
    "~^POST:/api/notes/[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]/(meta|open)$" access;
    "~^DELETE:/api/notes/[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$" access;
}

# An empty key skips this additional limit for all other operations.
map $erase_lane $erase_challenge_key {
    default "";
    challenge $server_name;
}

limit_req_zone "$server_name:$erase_lane" zone=erase_lane_req:1m rate=60r/s;
limit_req_zone $erase_challenge_key zone=erase_challenge_req:1m rate=10r/s;
limit_conn_zone "$server_name:$erase_lane" zone=erase_lane_conn:1m;

# Preserve Retry-After from the application. Only add it to local rejections.
map "$status:$upstream_status" $erase_retry_after {
    default "";
    "429:" 2;
    "503:" 2;
}
