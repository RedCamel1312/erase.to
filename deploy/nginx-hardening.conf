# Install as /etc/systemd/system/nginx.service.d/erase.conf.
# This changes the host nginx service, so review other hosted applications first.
[Service]
RuntimeDirectory=erase-nginx
RuntimeDirectoryMode=0755
MemoryMax=256M
MemorySwapMax=0
LimitCORE=0
NoNewPrivileges=yes
PrivateDevices=yes
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
