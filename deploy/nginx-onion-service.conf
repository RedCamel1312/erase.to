# Optional /etc/systemd/system/nginx.service.d/erase-onion.conf.
# Install alongside nginx-hardening.conf. Tor's private identity is never shared.
[Service]
# Do not add this directory to RuntimeDirectory: systemd would reapply the
# nginx unit's root:root/0755 defaults before each Exec command.
# Reset the vendor pre-start list: the restricted directory must precede nginx -t,
# which can briefly bind a new Unix socket while checking the configuration.
ExecStartPre=
ExecStartPre=/usr/bin/install -d -o root -g debian-tor -m 0750 /run/erase-onion
# Recover only our socket after an unclean stop; never remove it during reload.
ExecStartPre=/bin/sh -ec 'if test -S /run/erase-onion/erase.sock; then rm -- /run/erase-onion/erase.sock; fi'
ExecStartPre=/usr/sbin/nginx -t -q -g 'daemon on; master_process on;'
ExecStartPost=/usr/bin/chown root:debian-tor /run/erase-onion/erase.sock
ExecStartPost=/usr/bin/chmod 0660 /run/erase-onion/erase.sock
ExecReload=
ExecReload=/usr/sbin/nginx -t -q -g 'daemon on; master_process on;'
ExecReload=/usr/sbin/nginx -g 'daemon on; master_process on;' -s reload
ExecReload=/usr/bin/chown root:debian-tor /run/erase-onion/erase.sock
ExecReload=/usr/bin/chmod 0660 /run/erase-onion/erase.sock
